# Strava redirects the browser to strava-oauth without a Supabase login token,
# so that one function must accept unauthenticated GET requests.
# (It verifies its own signed "state" parameter instead.)
[functions.strava-oauth]
verify_jwt = false

[functions.strava-sync]
verify_jwt = true

# Stripe calls this webhook without a Supabase login token;
# it verifies the Stripe signature itself.
[functions.stripe-webhook]
verify_jwt = false

# Public profile pages report gear-link clicks without a Supabase login token.
[functions.track-gear-click]
verify_jwt = false

[functions.link-preview]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

# Public profile pages report views and cheers without a Supabase login token.
[functions.engage]
verify_jwt = false

# Public profile pages report link-block clicks without a Supabase login token.
[functions.track-link-click]
verify_jwt = false
